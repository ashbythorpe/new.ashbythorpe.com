<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit"
      defer
    ></script>
    <script type="module" src="/src/post.ts"></script>
  </head>
  <body>
    <nav-bar></nav-bar>
    <header id="header">
      <div id="header-content">{{HEADER}}</div>
    </header>

      <div id="blog-content">{{CONTENT}}</div>
      <div id="comments">
        <h1 id="comments-header">Comments</h1>
        <div id="comments-container"></div>
        <blog-pagination></blog-pagination>
      </div>
      <create-comment>
        <div id="create-comment-turnstile" slot="turnstile"></div>
      </create-comment>
    </main>
  </body>
</html>

<link rel="stylesheet" href="style.css" />
<header>
  <nav>
    <div id="logo" class="navbar-section">
      <a href="/">ashbythorpe</a>
    </div>
    <div id="navbar-items" class="navbar-section">
      <a
        href="/"
        class="navbar-item"
        id="navbar-home"
        aria-label="Home"
      >
        <home-icon class="icon"></home-icon>
        <span>Home</span>
      </a>
      <a
        href="/contact/"
        class="navbar-item"
        id="navbar-contact"
        aria-label="Contact"
      >
        <info-icon class="icon"></info-icon>

      <a

        id="navbar-projects"

      </a>
      <a
        href="/blog/"

        id="navbar-blog"

      >

      </a>

    <div id="github-container" class="navbar-section">
      <div id="github-border">
        <a
          href="https://github.com/ashbythorpe"
          class="text-black-700 hover:text-black-900"
          aria-label="GitHub"

          <github-icon class="w-6 h-auto"></github-icon>

<link rel="stylesheet" href="style.css" />
<content-card>
  <div class="form-body">
    <h1>Reset your password</h1>
    <form id="reset-password-form" class="view">
      <div class="input-group">
        <label for="new-password">New Password</label>
        <input
          type="password"
          id="new-password"
          name="password"
          required
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>
      <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          required
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>
      <div>
        <button id="reset-password-submit" type="submit" class="submit-btn">
          Reset Password
        </button>
        <p id="error" class="error" role="alert"></p>
      </div>
    </form>
    <p><a href="/auth/forgot-password/">Request a new reset link</a></p>
    <p><a href="/auth/sign-in/">Back to sign in</a></p>
  </div>
</content-card>

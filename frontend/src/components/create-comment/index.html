<link rel="stylesheet" href="style.css">

<div class="auth-prompt">
  <p>You must be signed in to leave a comment.</p>
  <a id="trigger-sign-in-btn" class="sign-in-btn">Sign In / Register</button>
</div>

<form id="comment-form" class="form-container">
  <div class="input-section">
    <!-- Editing Indicator -->
    <div id="edit-indicator" class="status-indicator">
      <svg
        class="icon-sm"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
        ></path>
        <path
          d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
        ></path>
      </svg>
      <p style="margin: 0">Editing</p>
      <button type="button" id="cancel-edit-btn" class="cancel-btn">
        <svg
          class="icon-sm"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Replying Indicator -->
    <div id="reply-indicator" class="status-indicator">
      <p style="margin: 0">
        Replying to <span id="reply-username" class="reply-target"></span>
      </p>
      <button type="button" id="cancel-reply-btn" class="cancel-btn">
        <svg
          class="icon-sm"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <div class="user-badge">
      <slot name="username">Guest</slot>
    </div>

    <div class="textarea-wrapper">
      <textarea
        id="content-input"
        name="content"
        placeholder="Add a comment..."
      ></textarea>
      <div id="field-errors"></div>
    </div>
  </div>

  <div class="action-section">
    <button type="submit" id="submit-btn" class="submit-btn">
      <p style="margin: 0">Comment</p>
      <svg
        class="icon"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
        ></path>
      </svg>
    </button>
    <div id="form-errors"></div>
  </div>
</form>

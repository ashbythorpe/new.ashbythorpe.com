<link rel="stylesheet" href="style.css">

<div class="auth-prompt">
  <p>You must be signed in to leave a comment.</p>
  <a id="trigger-sign-in-btn" class="sign-in-btn">Sign In / Register</button>
</div>

<form id="comment-form" class="form-container">
  <div class="input-section">
    <!-- Replying Indicator -->
    <div id="reply-indicator" class="status-indicator">
      <p style="margin: 0">
        Replying to <span id="reply-username" class="reply-target"></span>
      </p>
      <button type="button" id="cancel-reply-btn" class="cancel-btn">
        <svg
          class="icon-sm"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <div class="user-badge">
      <slot name="username">Guest</slot>
    </div>

    <div class="textarea-wrapper">
      <textarea
        id="content-input"
        name="content"
        placeholder="Add a comment..."
      ></textarea>
    </div>
  </div>

  <div class="action-section">
    <button type="submit" id="submit-btn" class="submit-btn">
      <p style="margin: 0">Comment</p>
      <include src="../../icons/paper-airplane.svg" class="icon" />
    </button>
    <p id="error" class="error"></p>
  </div>
</form>

<link rel="stylesheet" href="style.css">

<div class="auth-prompt">
  <a id="trigger-sign-in-btn" class="sign-in-btn">Log in / Register</a>
</div>

<form id="comment-form" class="form-container">
  <h2 class="form-heading">Leave a comment</h2>
  <div class="input-section">
    <!-- Replying Indicator -->
    <div id="reply-indicator" class="status-indicator">
      <p style="margin: 0">
        Replying to <span id="reply-username" class="reply-target"></span>
      </p>
      <button type="button" id="cancel-reply-btn" class="cancel-btn" aria-label="Cancel reply">
        <svg
          class="icon-sm"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <div class="user-badge">
      Commenting as <slot name="username">Guest</slot>
    </div>

    <div class="textarea-wrapper">
      <textarea
        id="content-input"
        name="content"
        aria-label="Your comment"
        required
        placeholder="Add a comment..."
      ></textarea>
    </div>
  </div>

  <slot name="turnstile"></slot>

  <div class="action-section">
    <button type="submit" id="submit-btn" class="submit-btn">
      <span>Post comment</span>
      <include src="../../icons/paper-airplane.svg" class="icon" />
    </button>
    <p id="error" class="error" role="alert"></p>
  </div>
</form>

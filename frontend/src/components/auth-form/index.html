<link rel="stylesheet" href="style.css" />
<div id="container">
  <content-card>
    <div class="auth-heading"><h2 class="login-heading">Welcome back.</h2><h2 class="signup-heading">Create an account.</h2></div>
    <div class="tabs" role="group" aria-label="Account access">
      <button id="tab-login" class="tab">Sign In</button>
      <button id="tab-signup" class="tab">Create Account</button>
    </div>

    <div class="form-body">
      <button type="button" id="github-auth-btn" class="github-btn">
        <svg class="github-icon" viewBox="0 0 24 24">
          <path
            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
          ></path>
        </svg>
        Continue with GitHub
      </button>
      <p id="auth-error" class="error" role="alert"></p>
      <p id="auth-success" class="success" role="status"></p>

      <div class="divider"><span>or email and password</span></div>

      <form id="login-view" class="view">
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <input
            type="email"
            id="login-email"
            name="email"
            required
            placeholder="you@example.com"
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            required
            placeholder="••••••••"
            autocomplete="current-password"
          />
        </div>
        <div class="turnstile"><slot name="log-in-turnstile"></slot></div>
        <div>
          <button id="login-submit" type="submit" class="submit-btn">
            Sign In
          </button>
          <p id="login-error" class="error" role="alert"></p>
          <a id="forgot-password" href="/auth/forgot-password/">Forgot your password?</a>
        </div>
      </form>

      <form id="signup-view" class="view">
        <div class="input-group">
          <label for="signup-name">Name</label>
          <input
            type="text"
            id="signup-name"
            name="name"
            required
            placeholder="Your public display name"
            autocomplete="name"
          />
        </div>
        <div class="input-group">
          <label for="signup-email">Email Address</label>
          <input
            type="email"
            id="signup-email"
            name="email"
            required
            placeholder="you@example.com"
            autocomplete="username"
          />
        </div>
        <div class="input-group">
          <label for="signup-password">Password</label>
          <input
            type="password"
            id="signup-password"
            name="password"
            required
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <div class="input-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input
            type="password"
            id="signup-confirm-password"
            name="confirm-password"
            required
            placeholder="••••••••"
            autocomplete="new-password"
          />
        </div>
        <div class="turnstile"><slot name="sign-up-turnstile"></slot></div>
        <div>
          <button id="signup-submit" type="submit" class="submit-btn">
            Create Account
          </button>
          <p id="signup-error" class="error" role="alert"></p>
        </div>
      </form>
    </div>
  </content-card>
</div>
